<svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    随身访问图标:蓝色瓦片上的手机(居中,不加右侧弧线)。

    沿用宿主插件美术的规范:36×36 画布、内缩 4 的 28×28 圆角瓦片(rx 8);
    不写死 width/height,显示尺寸交给消费方(插件管理器行 30 / 卡片 36)。
    配色是 Pocket 的蓝色:瓦片 #5CA8FF → #2F5BE0,记号用近白 #F4F8FF;
    外圈压一圈 0.9px 半透明白内边,避免深色行里糊成一块蓝方块。

    换图标时的护栏:必须是包内文件、SVG/PNG/JPEG/WebP、≤256 KiB
    (宿主 readPluginMeta 的读取条件),并同步 package.json 的 icon 字段。
  -->
  <rect x="4" y="4" width="28" height="28" rx="8" fill="url(#pocket_tile)"/>
  <rect x="4.45" y="4.45" width="27.1" height="27.1" rx="7.6" fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="0.9"/>
  <rect x="13" y="9.6" width="10" height="16.8" rx="3" stroke="#F4F8FF" stroke-width="2.1"/>
  <path d="M16.7 12.4h3.2" stroke="#F4F8FF" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
  <circle cx="18" cy="23" r="1.15" fill="#F4F8FF"/>
  <defs>
    <linearGradient id="pocket_tile" x1="18" y1="4" x2="18" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5CA8FF"/>
      <stop offset="1" stop-color="#2F5BE0"/>
    </linearGradient>
  </defs>
</svg>
