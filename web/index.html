<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket">
<meta name="mobile-web-app-capable" content="yes">
<title>Pocket · DSH</title>
<script>
(() => {
  let mode = 'system';
  try {
    const stored = localStorage.getItem('dsh_pocket_theme');
    if (stored === 'light' || stored === 'dark' || stored === 'system') mode = stored;
  } catch {}
  const dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#0b0e14' : '#f5f7fb');
  const statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if (statusBar) statusBar.setAttribute('content', dark ? 'black-translucent' : 'default');
})();
</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-180.png" sizes="180x180">
<link rel="apple-touch-icon" href="/icons/icon-192.png" sizes="192x192">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app" class="app">
  <div class="boot">
    <div class="boot-logo" aria-hidden="true"></div>
    <div class="boot-text">正在连接本机 DSH…</div>
  </div>
</div>
<noscript>Pocket 需要启用 JavaScript。</noscript>
<script type="module" src="/app.js"></script>
</body>
</html>
